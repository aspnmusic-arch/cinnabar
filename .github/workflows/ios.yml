name: iOS

on:
  pull_request:
    paths:
      - packaging/ios/**
      - .github/workflows/ios.yml
  push:
    branches:
      - ios/**
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: Build arm64 IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CINNABAR_IOS_PROFILE: play
      CARGO_INCREMENTAL: "0"
      FORK_CACHE_PATHS: |
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        ~/.cargo/git/db
        ~/.cargo/build
        target/aarch64-apple-ios
        ~/go/pkg/mod
        ~/Library/Caches/go-build
        .local/assets
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain and the iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Restore the fork build cache
        id: cache
        if: github.repository != 'cinnabar-mc/cinnabar'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FORK_CACHE_PATHS }}
          key: ios-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'core/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ios-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'core/go.sum') }}-
            ios-${{ runner.os }}-

      - name: Install the icon renderer
        run: brew install librsvg

      - name: Build the IPA
        run: bash packaging/ios/build-ipa.sh

      # 1. Descarga y compila los carriers (.local/assets/compiled) en el servidor
      - name: Compile game carriers
        run: make assets PROFILE=${{ env.CINNABAR_IOS_PROFILE }}

      # 2. Inyecta los carriers dentro de la IPA recién creada
      - name: Inject carriers into IPA
        run: |
          python3 packaging/ios/add-assets.py --help || true
          python3 packaging/ios/add-assets.py target/ios/*-unsigned.ipa .local/assets/compiled || \
          python3 packaging/ios/add-assets.py target/ios/*-unsigned.ipa

      - name: Save the fork build cache
        if: always() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FORK_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: cinnabar-ios-unsigned
          path: target/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
