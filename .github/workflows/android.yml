name: Android ARM64 BDS

# Manual build using the repository's Android packaging scripts.
# Test signing key: a later build may require uninstalling the previous APK.
on:
  workflow_dispatch:

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Parallel codegen without LTO keeps this build affordable; releases use `release`.
      CINNABAR_ANDROID_PROFILE: play
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cinnabar-mc/cinnabar
          ref: dev
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android SDK packages and cargo-ndk
        run: |
          pin() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' packaging/android/runtime.json "$1"; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$(pin target_sdk)" "build-tools;$(pin build_tools)" "ndk;$(pin ndk)" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$(pin cargo_ndk)" --locked
      - name: Install Android build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build the APK
        run: bash packaging/android/build-apk.sh
      - name: Verify packaged Android servers and BDS runtime
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          config = json.loads(Path("packaging/android/runtime.json").read_text())
          bds = config["bds_translation"]
          required = [config["core_library"], config["local_server_library"],
                      config["compiler_library"], bds["helper_library"]]
          required += [item["packaged"] for item in bds["native_runtime"]["libraries"]]
          apks = list(Path("target/android").glob("*-arm64-v8a.apk"))
          if not apks:
              raise SystemExit("No APK generated")
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  for name in required:
                      path = "lib/arm64-v8a/" + name
                      if path not in archive.namelist():
                          raise SystemExit("Missing native component: " + path)
                      if archive.getinfo(path).file_size == 0:
                          raise SystemExit("Empty native component: " + path)
              print("Verified native server components:", apk.name)
          PY
      - name: Record source revision
        run: |
          git rev-parse HEAD > target/android/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cinnabar-android-arm64
          path: |
            target/android/*-arm64-v8a.apk
            target/android/source-commit.txt
          if-no-files-found: error
          retention-days: 14

